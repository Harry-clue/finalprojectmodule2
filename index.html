<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>SPA</title>
</head>

<body class="bg-gradient-to-r from-blue-500 to-purple-500 min-h-screen flex  column items-center justify-center">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-white mb-4 flex justify-center">Welcome to Mekipedia
        </h1>
        <div class=" text-white p-4 flex justify-center space-x-4" bgcolor="white">
            <input
                class="border border-gray-300 rounded-md py-2 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                id="wordInput" type="text" placeholder="type a word and click search">
            <button class="bg-orange-500 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded"
                id="searchButton">Search</button>
        </div>
        <div class="p-4 flex flex-col rounded-md bg-transparent  text-black " id="results"></div>
        <script src="script.js"></script>
    </div>
</body>

</html>
